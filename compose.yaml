services:
  php:
    image: event-flow-php:dev
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/backend
    networks:
      - app

  nginx:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:${HTTP_FORWARD_PORT}:80"
    volumes:
      - ./backend/public:/var/www/backend/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app

  mysql:
    image: mysql:8.4.11
    ports:
      - "127.0.0.1:${MYSQL_FORWARD_PORT}:3306"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:${MAILPIT_UI_FORWARD_PORT}:8025"
    networks:
      - app

  redis:
    image: redis:7.4.11-alpine
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT}:6379"
    volumes:
      - redis-data:/data
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
